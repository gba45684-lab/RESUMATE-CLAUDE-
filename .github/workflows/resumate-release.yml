name: ResuMate signed release (Play)

# Manual only. Needs these repository secrets (create them once, keep the keystore file safe):
#   ANDROID_KEYSTORE_BASE64  base64 of your release .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets are present
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEY_PASSWORD" || { echo "Missing signing password or alias secret"; exit 1; }

      - run: npm install
      - run: npx cap add android
      - name: Block test ads in a store release
        run: |
          if grep -q "testing:true" www/index.html; then echo "ADS.testing is still true in www/index.html. Put your real AdMob banner id there and set testing:false before a store release."; exit 1; fi
          if [ -z "${{ vars.ADMOB_APP_ID }}" ]; then echo "Set the repository variable ADMOB_APP_ID (your real AdMob app id)."; exit 1; fi
      - name: Add the AdMob application id
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > android/app/release.keystore

      - name: Check keystore password, alias and key password
        env:
          KS_PASS_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS_PASS=$(printf '%s' "$KS_PASS_RAW" | tr -d '\r\n')
          KEY_PASS=$(printf '%s' "$KEY_PASS_RAW" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$ALIAS_RAW" | tr -d '\r\n ')
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "ANDROID_KEYSTORE_PASSWORD does not open the keystore. Re-enter the password from the keystore's creation, with no spaces."
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "ANDROID_KEY_ALIAS is not in the keystore. The alias must be exactly resumate-upload (or the one you used)."
            keytool -list -keystore android/app/release.keystore -storepass "$KS_PASS" 2>/dev/null | head -5
            exit 1
          fi
          printf 'probe' > "$RUNNER_TEMP/probe.txt"
          jar cf "$RUNNER_TEMP/probe.jar" -C "$RUNNER_TEMP" probe.txt
          if ! jarsigner -keystore android/app/release.keystore -storepass "$KS_PASS" -keypass "$KEY_PASS" "$RUNNER_TEMP/probe.jar" "$ALIAS" >/dev/null 2>&1; then
            echo "Signing test failed. For this keystore type (PKCS12) ANDROID_KEY_PASSWORD must be exactly the same as ANDROID_KEYSTORE_PASSWORD. Set both to the same value."
            exit 1
          fi
          echo "Keystore, alias and key password are OK."

      - name: Add signing and a version code that always goes up
        run: python3 .github/scripts/patch_gradle_signing.py

      - name: Build signed App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload App Bundle
        uses: actions/upload-artifact@v5
        with:
          name: ResuMate-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
