name: ResuMate Free OTA Release

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'api/updates.js'
      - '.github/workflows/resumate-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumate-free-ota
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create OTA version
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Package web bundle
        run: |
          cd www
          zip -r "../resumate-bundle.zip" . -x "*.DS_Store"
          cd ..
          sha256sum resumate-bundle.zip > resumate-bundle.sha256
          cat resumate-bundle.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            resumate-bundle.zip \
            --title "ResuMate $VERSION" \
            --generate-notes

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v$VERSION" --json tagName,assets
