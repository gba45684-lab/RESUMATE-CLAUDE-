name: Build ResuMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ''

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          SDKMANAGER=""
          for candidate in \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" \
            "/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found on the GitHub runner."
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name 'sdkmanager*' -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          command -v sdkmanager
          adb version
          sdkmanager --list_installed | head -80

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          cp resumate-redesign.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResuMate-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "ResuMate Android APK ${GITHUB_RUN_NUMBER}" \
            --notes "Android APK built automatically from the main branch. Commit: ${GITHUB_SHA}"
