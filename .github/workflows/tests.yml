name: ResuMate tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # reused by resumate-ota.yml so an update is never published without a passing suite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Node files parse
        run: |
          node --check api/updates.js
          node --check free-ai-proxy/worker.js

      - name: Install PDF tools used by the tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: App smoke tests
        run: |
          python tests/smoke1_main_flows.py
          python tests/smoke2_studio_flows.py
          python tests/native_app_test.py
          python tests/smoke6_theme_and_text.py
          python tests/smoke3_rewrite_flows.py
          python tests/smoke4_rewrite_followups.py
          python tests/ai_mock_test.py
          python tests/smoke5_content_ai.py
          python tests/smoke7_update_alerts.py
          python tests/smoke8_repo_fixes.py
          python tests/smoke9_check_fixes.py
          python tests/smoke10_fit_offline.py
          python tests/smoke11_import_clean.py
          python tests/smoke12_csp.py
          python tests/smoke13_ads_privacy.py
          python tests/smoke33_create_buttons.py
          python tests/smoke34_sample_or_own.py
          python tests/smoke35_job_versions_links.py
          python tests/smoke36_interview_from_resume.py
          python tests/smoke37_paywall_interstitial.py
          python tests/smoke38_export_limit.py
          python tests/smoke39_download_notify_dedupe.py
          python tests/smoke40_target_size.py
          python tests/smoke41_pdf_pages.py
          python tests/smoke42_image_tools_2.py
          python tests/smoke43_resume_sections.py

          python tests/smoke44_job_tracker.py
          python tests/smoke45_app_lock.py
          python tests/smoke46_pdf_extract_images.py
          python tests/smoke47_fingerprint_lock.py
          python tests/smoke48_lock_before_tour.py
          python tests/smoke49_tour_on_screen.py
