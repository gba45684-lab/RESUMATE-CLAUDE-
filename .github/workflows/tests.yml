name: ResuMate tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Node files parse
        run: |
          node --check api/updates.js
          node --check free-ai-proxy/worker.js

      - name: Install PDF tools used by the tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: App smoke tests
        run: |
          python tests/smoke1_main_flows.py
          python tests/smoke2_studio_flows.py
          python tests/native_app_test.py
          python tests/smoke6_theme_and_text.py
          python tests/smoke3_rewrite_flows.py
          python tests/smoke4_rewrite_followups.py
          python tests/ai_mock_test.py
